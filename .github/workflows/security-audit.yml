name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Executar diariamente às 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (worker)
        working-directory: worker
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install dependencies (baileys)
        working-directory: worker/baileys
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install dependencies (site/landing)
        working-directory: site/landing
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Run npm audit (worker)
        working-directory: worker
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate --production; fi

      - name: Run npm audit (baileys)
        working-directory: worker/baileys
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate --production; fi

      - name: Run npm audit (site/landing)
        working-directory: site/landing
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate --production; fi

      - name: Run npm audit (root - dev dependencies)
        run: |
          npm audit --audit-level=high

  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.19.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, gitleaks, trivy-fs, codeql]
    if: always()
    steps:
      - name: Generate Summary
        env:
          RESULT_NPM: ${{ needs.npm-audit.result }}
          RESULT_GITLEAKS: ${{ needs.gitleaks.result }}
          RESULT_TRIVY: ${{ needs.trivy-fs.result }}
          RESULT_CODEQL: ${{ needs.codeql.result }}
        run: |
          {
            echo "## 🔒 Security Audit Summary"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
          } >> "$GITHUB_STEP_SUMMARY"

          for pair in "npm-audit:$RESULT_NPM" "gitleaks:$RESULT_GITLEAKS" "trivy-fs:$RESULT_TRIVY" "codeql:$RESULT_CODEQL"; do
            job="${pair%%:*}"
            status="${pair#*:}"
            if [ "$status" = "success" ]; then
              emoji="✅"
            elif [ "$status" = "failure" ]; then
              emoji="❌"
            else
              emoji="⚠️"
            fi
            echo "| $job | $emoji $status |" >> $GITHUB_STEP_SUMMARY
          done
          
          {
            echo ""
            echo "**Recomendações:**"
            echo "- Revise falhas nos jobs acima"
            echo "- Atualize dependências com vulnerabilidades"
            echo "- Remova secrets detectados"
          } >> "$GITHUB_STEP_SUMMARY"
