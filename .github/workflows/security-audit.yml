name: Security Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Executar diariamente às 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

concurrency:
  group: security-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  npm-audit:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies (worker)
        working-directory: worker
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install dependencies (baileys)
        working-directory: worker/baileys
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Install dependencies (site/landing)
        working-directory: site/landing
        run: |
          if [ -f package.json ]; then npm ci; fi

      - name: Run npm audit (worker)
        working-directory: worker
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate --production; fi

      - name: Run npm audit (baileys)
        working-directory: worker/baileys
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate --production; fi

      - name: Run npm audit (site/landing)
        working-directory: site/landing
        run: |
          if [ -f package.json ]; then npm audit --audit-level=moderate --production; fi

      - name: Run npm audit (root - dev dependencies)
        run: |
          npm audit --audit-level=high

  gitleaks:
    name: Detect Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .github/gitleaks.toml

  trivy-fs:
    name: Trivy FS Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.19.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: /language:javascript-typescript

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [npm-audit, gitleaks, trivy-fs, codeql]
    if: always()
    steps:
      - name: Generate Summary
        run: |
          echo "## 🔒 Security Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          
          for job in npm-audit gitleaks trivy-fs codeql; do
            status="${{ needs.$job.result }}"
            if [ "$status" = "success" ]; then
              emoji="✅"
            elif [ "$status" = "failure" ]; then
              emoji="❌"
            else
              emoji="⚠️"
            fi
            echo "| $job | $emoji $status |" >> $GITHUB_STEP_SUMMARY
          done
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Recomendações:**" >> $GITHUB_STEP_SUMMARY
          echo "- Revise falhas nos jobs acima" >> $GITHUB_STEP_SUMMARY
          echo "- Atualize dependências com vulnerabilidades" >> $GITHUB_STEP_SUMMARY
          echo "- Remova secrets detectados" >> $GITHUB_STEP_SUMMARY
