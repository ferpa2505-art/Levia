name: Beta Release

on:
  push:
    tags:
      - 'v*-beta*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Beta version tag (e.g., v0.5.0-beta.1)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  beta:
    name: Build & Submit Beta
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Run Unit Tests
        run: npm run test:ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure iOS Credentials (EAS)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          echo "EAS will use credentials from eas.json and Expo dashboard"
          echo "Make sure APPLE_ID, ASC_APP_ID, APPLE_TEAM_ID are set in eas.json or Expo dashboard"

      - name: Configure Android Credentials (EAS)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          echo "EAS will use Google Play service account from Expo dashboard"
          echo "Make sure service account key is uploaded to Expo"

      - name: Build iOS (Beta)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas build --platform ios --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android (Beta)
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: eas build --platform android --profile production --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Wait for Builds
        if: ${{ secrets.EXPO_TOKEN != '' }}
        run: |
          echo "Builds submitted. Check Expo dashboard for status."
          echo "Build URLs will be available in the Actions summary."

      - name: Submit iOS to TestFlight (Beta)
        if: ${{ secrets.EXPO_TOKEN != '' && secrets.ASC_API_KEY != '' }}
        run: eas submit --platform ios --profile beta --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}

      - name: Submit Android to Play Console (Internal/Closed)
        if: ${{ secrets.EXPO_TOKEN != '' && secrets.GOOGLE_SERVICE_ACCOUNT_JSON != '' }}
        run: eas submit --platform android --profile beta --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Post Build Summary
        if: always()
        run: |
          echo "## Beta Release Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Tag:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| iOS | Check Expo dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "| Android | Check Expo dashboard |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next Steps:**" >> $GITHUB_STEP_SUMMARY
          echo "1. Monitor builds at https://expo.dev/accounts/ferpa2505-art/projects/levia-app/builds" >> $GITHUB_STEP_SUMMARY
          echo "2. When builds complete, submit to stores (or auto-submit if configured)" >> $GITHUB_STEP_SUMMARY
          echo "3. Add testers in TestFlight / Play Console" >> $GITHUB_STEP_SUMMARY
          echo "4. Send welcome emails to beta testers" >> $GITHUB_STEP_SUMMARY

  notify:
    name: Notify Team
    needs: beta
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Send Notification (placeholder)
        run: |
          echo "📢 Beta release ${{ github.ref_name }} completed"
          echo "   Status: ${{ needs.beta.result }}"
          echo "   Check GitHub Actions for details"
          # Add Slack/Discord/Email webhook here if needed