name: Smoke test (somente leitura)

# Manual: confere a produção só com GET, HEAD e OPTIONS (sem token, sem dados, sem escrita).
# Use depois de publicar ou de fazer rollback. "sha" exige o app nesse commit; "sha_worker" exige o Worker (que só muda quando worker/** muda).
on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Commit esperado no APP (7 a 40 caracteres hex). Vazio = não exige."
        required: false
        default: ""
      sha_worker:
        description: "Commit esperado no Worker (7 a 40 caracteres hex). Vazio = não exige."
        required: false
        default: ""

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Smoke test
        env:
          SHA_ESPERADO: ${{ inputs.sha }}
          SHA_WORKER_ESPERADO: ${{ inputs.sha_worker }}
        run: |
          args=()
          if [ -n "$SHA_ESPERADO" ]; then args+=(--sha "$SHA_ESPERADO"); fi
          if [ -n "$SHA_WORKER_ESPERADO" ]; then args+=(--sha-worker "$SHA_WORKER_ESPERADO"); fi
          node scripts/smoke.cjs "${args[@]}"
