name: Deploy Privacy & Terms Pages (GitHub Pages)

on:
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/workflows/deploy-github-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: deploy-levia-github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify web pages exist
        run: |
          test -f web/index.html || { echo "web/index.html missing"; exit 1; }
          test -f web/termos.html || { echo "web/termos.html missing"; exit 1; }

      - name: Copy to deployment directory
        run: |
          mkdir -p dist
          cp web/index.html dist/
          cp web/termos.html dist/
          # Create a simple index redirect if needed
          cat > dist/robots.txt <<'EOF'
User-agent: *
Allow: /
EOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7c38e9c2e5b2a4c6b8b8e8c8b8e8c8b8e8c8b8e8
        with:
          path: dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@7c38e9c2e5b2a4c6b8b8e8c8b8e8c8b8e8c8b8e8