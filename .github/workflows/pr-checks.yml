name: PR checks

on:
  pull_request:
    branches:
      - main
      - pwa-v0.4.0
  push:
    branches:
      - main
      - pwa-v0.4.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-api-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --runInBand --watch=false __tests__/ia-consentimento.test.ts

      - run: npm test -- --runInBand --watch=false __tests__/worker-

      - run: |
          if [ -f public/sw.js ]; then
            node --check public/sw.js
          fi
          if [ -f worker/src/index.js ]; then
            node --check worker/src/index.js
          fi
