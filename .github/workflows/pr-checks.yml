name: PR checks

on:
  pull_request:
    branches:
      - main
      - pwa-v0.4.0
  push:
    branches:
      - main
      - pwa-v0.4.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Sintaxe dos próprios workflows: um erro de YAML ou de expressão aqui só apareceria
  # no deploy (ou nem isso), então vale barrar no PR.
  actionlint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (sintaxe dos workflows)
        env:
          ACTIONLINT_VERSAO: "1.7.12"
          # digest publicado em actionlint_1.7.12_checksums.txt; troque ao subir a versão
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSAO}/actionlint_${ACTIONLINT_VERSAO}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  /tmp/actionlint.tar.gz" | sha256sum -c -
          tar -xzf /tmp/actionlint.tar.gz -C /tmp actionlint
          /tmp/actionlint -color

  worker-api-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --runInBand --watch=false __tests__/ia-consentimento.test.ts

      - run: npm test -- --runInBand --watch=false __tests__/worker-

      - run: |
          if [ -f public/sw.js ]; then
            node --check public/sw.js
          fi
          if [ -f worker/src/index.js ]; then
            node --check worker/src/index.js
          fi

  # EAS Build — verifica se o build nativo compila (iOS + Android preview)
  # Roda apenas em PRs para main e pushes em main (evita gastar créditos em forks)
  eas-build:
    if: github.event_name == 'pull_request' && github.base_ref == 'main' || github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write  # para OIDC token no Expo
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Expo
        uses: expo/expo-github-action@8d2d9c0c6d8c8b8e8c8b8e8c8b8e8c8b8e8c8b8e8 # v8
        with:
          expo-version: latest
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Configure EAS
        run: |
          cat > eas.json << 'EOF'
          {
            "cli": { "version": ">= 5.0.0" },
            "build": {
              "preview": {
                "distribution": "internal",
                "ios": { "simulator": true },
                "android": { "buildType": "apk" }
              }
            },
            "submit": { "production": {} }
          }
          EOF

      - name: EAS Build (iOS Simulator + Android APK)
        run: eas build --profile preview --platform all --non-interactive --no-wait
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
