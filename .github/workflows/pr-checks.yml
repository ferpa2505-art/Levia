name: PR checks

on:
  pull_request:
    branches:
      - main
      - pwa-v0.4.0
  push:
    branches:
      - main
      - pwa-v0.4.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-api-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run type-check
      - run: npm test -- --runInBand --watch=false __tests__/ia-consentimento.test.ts

      - run: npm test -- --runInBand --watch=false __tests__/worker-

      - run: |
          if [ -f public/sw.js ]; then
            node --check public/sw.js
          fi
          if [ -f worker/src/index.js ]; then
            node --check worker/src/index.js
          fi
