name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: 'if [ -f public/sw.js ]; then node --check public/sw.js; fi'
      - run: 'if [ -f worker/src/index.js ]; then node --check worker/src/index.js; fi'
      - run: 'if [ -d scripts ]; then ARQ=$(find scripts -maxdepth 1 -type f -name "*.py" -print 2>/dev/null || true); if [ -n "$ARQ" ]; then python -m py_compile $ARQ; fi; fi'
