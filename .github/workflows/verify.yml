name: verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run type-check
      - run: 'if [ -f public/sw.js ]; then node --check public/sw.js; fi'
      - run: 'if [ -f worker/src/index.js ]; then node --check worker/src/index.js; fi'
      - run: 'if [ -d scripts ]; then ARQ=$(find scripts -maxdepth 1 -type f -name "*.py" -print 2>/dev/null || true); if [ -n "$ARQ" ]; then python -m py_compile $ARQ; fi; fi'
