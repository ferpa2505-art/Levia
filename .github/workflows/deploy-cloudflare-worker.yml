name: Deploy Worker (levia-ia-worker)

on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-levia-ia-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/src/index.js
      - run: npm test -- --runInBand --watch=false __tests__/worker-

  deploy:
    needs: test
    # disparo manual a partir de outro branch não publica em produção
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    environment:
      name: production
      url: https://levia-ia-worker.ferpa2505.workers.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Migrations ANTES de publicar: o schema nunca pode ficar atrás do código (um INSERT em
      # tabela nova falha dentro de try/catch e fica invisível). Se o token do CI não alcançar o
      # D1 (erro 7403), o passo avisa e segue: perder o deploy é pior do que publicar com atraso.
      - name: Aplicar migrations do D1 (antes do deploy)
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set +e
          saida=$(npx --yes wrangler@4 d1 migrations apply levia-licencas-dev --remote 2>&1)
          codigo=$?
          echo "$saida"
          if [ $codigo -eq 0 ]; then
            exit 0
          fi
          if echo "$saida" | grep -q "7403"; then
            echo "::warning::Migrations do D1 NAO rodaram: o token do CI nao tem permissao D1 (erro 7403)."
            echo "::warning::Rode manualmente e confira: cd worker && npx wrangler d1 migrations apply levia-licencas-dev --remote"
            exit 0
          fi
          echo "::error::Migration falhou de verdade (SQL ou banco): o deploy nao vai seguir."
          exit $codigo
      - name: Deploy levia-ia-worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          # a tag da versao e o commit: o /versao e o /health passam a informar o version_metadata da Cloudflare
          command: deploy --tag ${{ github.sha }}
      - name: Check /health (ok, id da versao e tag com o commit)
        run: |
          for i in 1 2 3; do
            corpo=$(curl -fsS https://levia-ia-worker.ferpa2505.workers.dev/health || true)
            echo "$corpo"
            if echo "$corpo" | grep -q '"ok":true' \
              && echo "$corpo" | grep -q '"versao":"[0-9a-f-]\{8,\}' \
              && echo "$corpo" | grep -q "\"tag\":\"${GITHUB_SHA}\""; then
              exit 0
            fi
            sleep 5
          done
          echo "o /health no ar nao informa ok, a versao e a tag ${GITHUB_SHA}"; exit 1
      - name: Check /versao (commit publicado)
        run: |
          for i in 1 2 3; do
            curl -fsS https://levia-ia-worker.ferpa2505.workers.dev/versao | grep -q "\"commit\":\"${GITHUB_SHA}\"" && exit 0
            sleep 5
          done
          echo "o Worker no ar não informa o commit ${GITHUB_SHA}"; exit 1
