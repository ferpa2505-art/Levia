name: Deploy Worker (levia-ia-worker)

on:
  push:
    branches:
      - pwa-v0.4.0
    paths:
      - "worker/**"
      - ".github/workflows/deploy-cloudflare-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-levia-ia-worker
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --check worker/src/index.js
      - run: npm test -- --runInBand --watch=false __tests__/worker-api-synthetic.test.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://levia-ia-worker.ferpa2505.workers.dev
    steps:
      - uses: actions/checkout@v4
      - name: Deploy levia-ia-worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          wranglerVersion: "4"
          command: deploy
      - name: Check /health
        run: curl -fsS https://levia-ia-worker.ferpa2505.workers.dev/health | grep -q '"ok":true'
