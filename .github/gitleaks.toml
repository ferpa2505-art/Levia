title = "Leviã GitLeaks Configuration"

[extend]
useDefault = true

[[rules]]
id = "levia-gemini-api-key"
description = "Google Gemini API Key"
regex = '''(?i)(gemini[_-]?api[_-]?key|api[_-]?key[_-]?gemini)['"]?\s*[:=]\s*['"]([a-zA-Z0-9_-]{30,})['"]'''
tags = ["api-key", "google", "gemini"]

[[rules]]
id = "levia-turnstile-secret"
description = "Cloudflare Turnstile Secret Key"
regex = '''(?i)(turnstile[_-]?secret[_-]?key|secret[_-]?key[_-]?turnstile)['"]?\s*[:=]\s*['"]([a-zA-Z0-9_-]{30,})['"]'''
tags = ["api-key", "cloudflare", "turnstile"]

[[rules]]
id = "levia-hmac-key"
description = "HMAC Keys (Phone, Email)"
regex = '''(?i)(hmac[_-]?key|hash[_-]?key|encryption[_-]?key)['"]?\s*[:=]\s*['"]([a-zA-Z0-9_-]{20,})['"]'''
tags = ["secret", "hmac", "encryption"]

[[rules]]
id = "levia-resend-api-key"
