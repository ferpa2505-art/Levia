regex = '''(?i)(resend[_-]?api[_-]?key|api[_-]?key[_-]?resend)['"]?\s*[:=]\s*['"](re_[a-zA-Z0-9_-]{40,})['"]'''
tags = ["api-key", "resend", "email"]

[[rules]]
id = "levia-whatsapp-secret"
