name = "levia-ia-worker"
main = "src/index.js"
compatibility_date = "2026-09-21"
workers_dev = true
preview_urls = false

# Logs só com contagens e tempos — nunca a foto
[observability]
enabled = true

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
# grátis: fotos por instalação a cada 7 dias
FOTOS_GRATIS_7D = "2"
# teto de segurança da conta inteira por dia (protege o saldo pré-pago)
MAX_FOTOS_DIA = "300"
# por endereço IP, por hora
MAX_FOTOS_IP_HORA = "20"
# Hostnames que podem concluir o desafio Turnstile (sitekey e secret são configurados no Worker)
TURNSTILE_ALLOWED_HOSTNAMES = "leviapp.org,www.leviapp.org,levia-app.netlify.app,localhost"

[[kv_namespaces]]
binding = "LEVIA_COTAS"
id = "7cb6991665974b96b3d7ce447f067a9a"

# Banco de desenvolvimento para contas, testes, pagamentos e licenças.
[[d1_databases]]
binding = "LEVIA_DB"
database_name = "levia-licencas-dev"
database_id = "e12692fa-0123-4cfc-811d-18ca91ec39da"
migrations_dir = "migrations"

# Segredos do Worker (wrangler secret put NOME): GEMINI_API_KEY, TURNSTILE_SECRET_KEY,
# TYPEBOT_SHARED_SECRET, TYPEBOT_PHONE_HMAC_KEY (diferente do anterior), EMAIL_HASH_KEY (nova),
# EMAIL_ENCRYPTION_KEY (32 bytes em base64), RESEND_API_KEY, EMAIL_FROM,
# WHATSAPP_WEBHOOK_SECRET (igual ao do gateway Baileys), GATEWAY_TOKEN (rota /api/lead).
# Variáveis públicas: TURNSTILE_SITE_KEY, APP_BASE_URL (domínio real do app).
# TURNSTILE_SITE_KEY é uma variável pública de execução, nunca uma chave secreta.
