services:
  baileys-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: levia-baileys-gateway
    restart: unless-stopped
    environment:
      - WORKER_URL=https://levia-ia-worker.ferpa2505.workers.dev
      - WHATSAPP_WEBHOOK_SECRET=${WHATSAPP_WEBHOOK_SECRET}
      - HEARTBEAT_INTERVAL_MS=30000
      - RECONNECT_DELAY_MS=5000
    volumes:
      - baileys-auth:/app/auth
      - ./logs:/app/logs
      # vídeo e criativos enviados pelo LEVI (levia-uso.mp4, criativo-1.jpg…); fora do Git de propósito
      - ./media:/app/media:ro
    healthcheck:
      # confere a conexão real com o WhatsApp (endpoint /health, só dentro do container)
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  baileys-auth: